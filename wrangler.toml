name = "midday-buddy"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Production Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "midday-buddy-db"
database_id = "d1-midday-buddy-prod-db"
migrations_dir = "migrations"

# Environment Variables (Non-secret configuration)
[vars]
ENVIRONMENT = "production"
APP_NAME = "MidDay Buddy"
ALLOWED_ORIGINS = "https://midday-buddy.pages.dev,http://localhost:3000"
