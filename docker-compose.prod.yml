services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midday_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-midday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midday} -d ${POSTGRES_DB:-midday_buddy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Uses local self-managed Postgres by default; override with Supabase DATABASE_URL to connect to Supabase instead
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-midday}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-midday_buddy}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      replicas: 4
      restart_policy:
        condition: on-failure

volumes:
  pg_data:
